[package]
name = "train-together"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "train-together"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Small, fast-starting binary for the scratch container image.
[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
