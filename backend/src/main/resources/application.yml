server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:./data/couples.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false

# Frontend dev origin allowed for CORS (see WebConfig).
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
