name: Build Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr.io/<owner>/<repo>; metadata-action lowercases the name for GHCR.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when we intend to push (skips on PRs from forks).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Build on every event; only publish on non-PR (main / tags / dispatch).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After a successful build on main, bump the image tag in the home-infra
  # GitOps repo so ArgoCD rolls out the new image on the home k3s cluster.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout home-infra
        uses: actions/checkout@v4
        with:
          repository: Nik5036350/home-infra
          # Fine-grained PAT (or deploy key) with contents:write on home-infra.
          token: ${{ secrets.HOME_INFRA_TOKEN }}

      - name: Bump gym image tag
        run: |
          TAG="sha-${GITHUB_SHA::7}"   # matches docker/metadata-action type=sha
          # home-infra's infra/ is a Helm chart; gym.yaml lives under templates/
          sed -i -E "s#(image: ghcr.io/nik5036350/train-together):.*#\1:${TAG}#" infra/templates/gym.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/templates/gym.yaml
          git commit -m "gym: deploy ${TAG}" || { echo "no change to deploy"; exit 0; }
          git push
