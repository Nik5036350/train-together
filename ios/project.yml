# Train Together iOS app. Generate the Xcode project with `xcodegen generate`
# (the .xcodeproj is not checked in). Core logic lives in the local package
# Packages/TrainTogetherKit, testable on the Mac with `swift test`.
name: TrainTogether
options:
  bundleIdPrefix: io.github.nik5036350
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  # Includes the gitignored Signing.xcconfig (your Personal Team id) if present.
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  TrainTogetherKit:
    path: Packages/TrainTogetherKit
targets:
  TrainTogether:
    type: application
    platform: iOS
    sources:
      - path: TrainTogether
      - path: Shared
    dependencies:
      - package: TrainTogetherKit
        product: TrainTogetherKit
      - package: TrainTogetherKit
        product: TrainTogetherCore
      - target: TrainTogetherWidgets
        embed: true
    info:
      path: TrainTogether/Info.plist
      properties:
        CFBundleDisplayName: Train Together
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        UIApplicationSupportsIndirectInputEvents: true
        UIAppFonts: &fonts
          - RobotoCondensed-Bold.ttf
          - RobotoCondensed-ExtraBold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Plain HTTP only to local addresses (the simulator talking to
          # `cargo run`); production sync is HTTPS.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nik5036350.traintogether
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TrainTogetherWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TrainTogetherWidgets
      - path: Shared
      - path: TrainTogether/DesignSystem/Theme.swift
      - path: TrainTogether/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: TrainTogetherKit
        product: TrainTogetherCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: TrainTogetherWidgets/Info.plist
      properties:
        CFBundleDisplayName: Train Together
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: *fonts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nik5036350.traintogether.widgets
  TrainTogetherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrainTogetherTests
    dependencies:
      - target: TrainTogether
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TrainTogetherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TrainTogetherUITests
    dependencies:
      - target: TrainTogether
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TrainTogether
schemes:
  TrainTogether:
    build:
      targets:
        TrainTogether: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrainTogetherTests
        - package: TrainTogetherKit/TrainTogetherKitTests
    archive:
      config: Release
  # End-to-end UI flow against a local backend; see TrainTogetherUITests.
  TrainTogetherE2E:
    build:
      targets:
        TrainTogether: all
        TrainTogetherUITests: [test]
    test:
      config: Debug
      targets:
        - TrainTogetherUITests
